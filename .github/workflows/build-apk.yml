name: 云端编译 ScreenQA APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 展开工程源码
        run: |
          set -e
          mkdir -p app app/src/main app/src/main/assets app/src/main/java/com/example/screenqa app/src/main/res/values
          cat > .gitignore <<'SQEOF_1'
          *.iml
          .gradle/
          /build/
          /app/build/
          /local.properties
          /.idea/
          .DS_Store
          /captures/
          .externalNativeBuild
          .cxx/
          SQEOF_1
          cat > app/build.gradle.kts <<'SQEOF_2'
          import java.util.Properties
          
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          
