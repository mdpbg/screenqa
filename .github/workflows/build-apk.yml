                      recognizer.process(InputImage.fromBitmap(bitmap, rotation))
                          .addOnSuccessListener { visionText ->
                              // 回调异常必须兜住，否则递归链断裂、bitmap 不回收、按钮卡死
                              runCatching {
                                  val text = visionText.text.trim()
                                  val score = scoreOcrText(text)
                                  val (nText, nScore) = if (score > bestScore) text to score else bestText to bestScore
                                  // 已识别到足量有效字符（一屏题目通常远超此值），方向正确，提前收敛省算力
                                  if (nScore >= OCR_ENOUGH_CHARS) {
                                      deliverOcr(bitmap, nText)
                                  } else {
                                      tryOcrDirection(bitmap, directions, index + 1, nText, nScore)
                                  }
                              }.onFailure {
                                  tryOcrDirection(bitmap, directions, index + 1, bestText, bestScore)
                              }
                          }
                          .addOnFailureListener {
                              // 该方向失败（含非法 rotation），尝试下一个；全部失败会走 deliverOcr 空文本
                              tryOcrDirection(bitmap, directions, index + 1, bestText, bestScore)
                          }
                  } catch (t: Throwable) {
                      tryOcrDirection(bitmap, directions, index + 1, bestText, bestScore)
                  }
                  Unit
              }
          
              /** OCR 全方向完成后统一回收 bitmap 并交给题目处理；回收恰好一次 */
              private fun deliverOcr(bitmap: Bitmap, text: String) {
                  runCatching { bitmap.recycle() }
                  if (destroyed) {
                      finishFlow()
                      return
                  }
                  try {
                      handleQuestion(text)
                  } catch (t: Throwable) {
                      setResult("识别处理异常：${t.javaClass.simpleName}：${t.message ?: ""}")
                      finishFlow()
                  }
              }
          
              /**
               * OCR 文本评分：方向正确时文字多、方向错时几乎无有效字符。
               * 中文/日文按 3 分、字母数字按 1 分加权——兼顾纯英文题目，避免只数中文误判。
               */
              private fun scoreOcrText(s: String): Int {
                  var score = 0
                  for (ch in s) {
                      when {
                          ch in '\u4E00'..'\u9FFF' -> score += 3
                          ch.isLetterOrDigit() -> score += 1
                      }
                  }
                  return score
              }
          
              /**
               * 题干压缩展示：OCR 出的题干含全部 A/B/C/D 选项，很长；悬浮窗答案区仅 45% 屏高，
               * 原样塞入会把答案顶到滚动区下方（用户又看不到答案）。这里截到第一个选项行之前，
               * 只保留题号+题干主干；找不到选项行时按长度兜底截断。
               */
              private fun briefQuestion(q: String): String {
                  val t = q.trim()
                  val opt = Regex("(?:^|\\n)\\s*[A-Da-d]\\s*[、.．)]").find(t)
                  val head = if (opt != null && opt.range.first > 0) t.substring(0, opt.range.first) else t
                  val trimmed = head.trim()
                  return if (trimmed.length > 160) trimmed.substring(0, 160) + "…" else trimmed
              }

              // ---------------- 题目处理（单题 / 多题） ----------------

              private fun handleQuestion(ocrText: String) {
                  if (destroyed) {
                      finishFlow()
                      return
                  }
                  try {
                      val cleaned = ocrText.trim()
                      if (cleaned.isEmpty()) {
                          setResult("没有识别到文字，换个页面再试。")
                          finishFlow()
                          return
                      }
                      val questions = QuestionSplitter.split(cleaned)
                      if (questions.isEmpty()) {
                          setResult("没有识别到题目，换个页面再试。")
                          finishFlow()
                          return
                      }
          
                      if (questions.size == 1) {
                          val q = questions[0]
                          answerOne(q) { ans ->
                              // 单题也带题干：压缩题干（去掉冗长选项）避免把答案顶出可视区
                              setResult("【题目】\n${briefQuestion(q)}\n\n$ans", isAnswer = true)
                              finishFlow()
                          }
                          return
                      }
          
                      // 多题：逐题作答，按题号顺序汇总，避免答案混在一起
                      val results = arrayOfNulls<String>(questions.size)
                      val remaining = AtomicInteger(questions.size)
                      setResult("识别到 ${questions.size} 道题，逐题解答中…")
                      questions.forEachIndexed { i, q ->
                          answerOne(q) { ans ->
                              // 每题都带题干（压缩版）：格式【第N题】→题目主干→答案
                              results[i] = "【第${i + 1}题】\n${briefQuestion(q)}\n\n$ans"
                              val left = remaining.decrementAndGet()
                              if (left == 0) {
                                  setResult(results.joinToString("\n\n────────────────\n\n"), isAnswer = true)
                                  finishFlow()
                              } else {
                                  setResult("已解答 ${questions.size - left}/${questions.size} 题…")
                              }
                          }
                      }
                  } catch (t: Throwable) {
                      setResult("识别处理异常：${t.javaClass.simpleName}：${t.message ?: ""}")
                      finishFlow()
                  }
              }
          
              /**
               * 单题作答，严格按「题库优先、AI 兜底」顺序：
               *  1) 先查本地题库 —— 命中即返回，来源标【题库】，秒出、不消耗算力；
               *  2) 题库未命中且配置了 API Key —— 才调用 AI（联网、较慢）；
               *  3) 既未命中也没配 Key —— 给出明确提示，不静默失败。
               * callback 保证只被调用一次。
               */
              private fun answerOne(question: String, callback: (String) -> Unit) {
                  if (destroyed) {
                      runCatching { callback("") }
                      return
                  }
                  try {
                      val local = runCatching { db.search(question) }.getOrNull()?.trim()
                      if (!local.isNullOrEmpty()) {
                          // local 已由题库解析器标准化为【答案】…【解析】…格式，这里只加来源标记，
                          // 绝不能再套一层【答案】——否则会出现截图里的双重【答案】。
                          val alreadyTagged = local.contains("【答案】")
                          callback("【题库】\n${if (alreadyTagged) "" else "【答案】\n"}${TextCleaner.clean(local).trim()}")
                          return
                      }
                      // 题库未命中（含查到空答案）→ 继续走 AI 兜底
                      if (!AiClient.isConfigured(this)) {
                          callback("【答案】\n题库未命中，且未配置 API Key（打开 App 选择 AI 服务商并填写对应 Key 后可 AI 解答）")
                          return
                      }
                      // 捕获发起时的流程序号：AI 是异步的，若期间用户已发起新一轮识别，
                      // 旧回调必须丢弃，否则会在新一轮中途重新聚焦、抢走下层 App 焦点。
                      val mySeq = flowSeq.get()
                      AiClient.ask(this, question) { ans ->
                          mainHandler.post {
                              if (destroyed || flowSeq.get() != mySeq) return@post
                              try {
                                  callback(ans)
                              } catch (t: Throwable) {
                                  setResult("解答回调异常：${t.javaClass.simpleName}")
                                  finishFlow()
                              }
                          }
                      }
                  } catch (t: Throwable) {
                      try {
                          callback("【答案】\n本地解析异常：${t.javaClass.simpleName}")
                      } catch (ignored: Throwable) {
                          finishFlow()
                      }
                  }
              }
          
              // ---------------- 结果展示（答案蓝色加粗、解析灰色） ----------------
          
              private fun setResult(text: String, isAnswer: Boolean = false) {
                  // 显式 () -> Unit：if 分支末值是 onFailure 返回的 Result，else 分支是赋值，
                  // 不显式声明会被 K2 推断成 () -> Any，导致 mainHandler.post 报类型不匹配。
                  val task: () -> Unit = {
                      val cleaned = runCatching { TextCleaner.clean(text) }.getOrDefault(text)
                      // 真正的答案就绪后，临时允许窗口聚焦，用户即可用光标选中、长按复制答案
                      if (isAnswer) setSelectionEnabled(true)
                      if (::resultText.isInitialized) {
                          runCatching { resultText.text = styleText(cleaned) }
                              .onFailure { runCatching { resultText.text = cleaned } }
                      } else {
                          pendingResult = cleaned
                      }
                      Unit
                  }
                  if (Looper.myLooper() == Looper.getMainLooper()) {
                      task()
                  } else {
                      mainHandler.post(Runnable { task() })
                  }
              }
          
              /**
               * 焦点模式深模块：把"是否允许与悬浮窗文本交互"封装在单一接缝里。
               *  - enabled=true（答案就绪）：清除 FLAG_NOT_FOCUSABLE，令 TextView 的
               *    光标选中与系统「复制/全选」菜单可用；
               *  - enabled=false（新一轮识别）：恢复 FLAG_NOT_FOCUSABLE，避免悬浮窗
               *    抢走下层 App（如学习通）的焦点，保证截屏与输入不受影响。
               * 调用方只需传布尔，不接触 WindowManager 位运算；重复调用幂等。
               */
              private fun setSelectionEnabled(enabled: Boolean) {
                  // 无论窗口当前是否挂载，都先记录期望状态：缩小后答案就绪、再展开时能据此恢复
                  selectionAllowed = enabled
                  if (!::overlayParams.isInitialized || !::floatView.isInitialized || !viewAdded) return
                  val base = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                  val wantFocusable = enabled
                  val alreadyFocusable = (overlayParams.flags and base) == 0
                  if (wantFocusable == alreadyFocusable) return // 幂等：状态已符合，避免多余 updateViewLayout
                  if (!wantFocusable) {
                      // 交还焦点：窗口正持有焦点时仅加回 flag 不足以让焦点可靠回到下层 App，
                      // 会导致学习通输入框无法点击/键盘不弹。先主动释放 TextView 焦点再改 flag。
                      runCatching {
                          if (::resultText.isInitialized && resultText.hasFocus()) resultText.clearFocus()
                          floatView.clearFocus()
                      }
                      clearTextSelection()
                  }
                  overlayParams.flags = if (wantFocusable) {
                      overlayParams.flags and base.inv()
                  } else {
                      overlayParams.flags or base
                  }
                  runCatching { windowManager.updateViewLayout(floatView, overlayParams) }
              }
          
              /** 正确清除 TextView 的选区高亮：Selection 由 android.text.Selection 管理，clearFocus 清不掉。 */
              private fun clearTextSelection() {
                  runCatching {
                      if (::resultText.isInitialized) {
                          // 必须先存局部变量再 is 检查：Kotlin 不会对属性访问(resultText.text)做智能转换，
                          // 直接传 resultText.text 会被推断为 CharSequence!，无法作为 Spannable 传入。
                          val sp = resultText.text
                          if (sp is Spannable) Selection.removeSelection(sp)
                      }
                  }
              }
          
              private fun styleText(text: String): CharSequence {
                  val ssb = SpannableStringBuilder(text)
                  fun color(regex: Regex, colorInt: Int, bold: Boolean) {
                      regex.findAll(text).forEach { m ->
                          ssb.setSpan(
                              ForegroundColorSpan(colorInt),
                              m.range.first, m.range.last + 1, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                          )
                          if (bold) ssb.setSpan(
                              StyleSpan(Typeface.BOLD),
                              m.range.first, m.range.last + 1, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                          )
                      }
                  }
                  color(Regex("【第\\d+题】"), COLOR_PRIMARY, true)
                  color(Regex("【题目】"), COLOR_PRIMARY, true)
                  color(Regex("【答案】"), COLOR_PRIMARY, true)
                  color(Regex("【题库】"), COLOR_PRIMARY, true)
                  color(Regex("【AI解答】"), COLOR_PRIMARY, true)
                  color(Regex("【解析】"), COLOR_GRAY, false)
                  return ssb
              }
          
              // ---------------- 配置变化 / 生命周期 ----------------
          
              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  // 旋转等配置变化时保持悬浮窗，不销毁
                  if (viewAdded && ::floatView.isInitialized) {
                      runCatching { windowManager.updateViewLayout(floatView, overlayParams) }
                  }
                  // 官方推荐的尺寸变更做法：resize + setSurface，绝不重新 createVirtualDisplay
                  mainHandler.post { resizeCaptureIfNeeded() }
              }
          
              private fun resizeCaptureIfNeeded() {
                  if (destroyed) return
                  val vd = virtualDisplay ?: return
                  val m = resources.displayMetrics
                  val w = m.widthPixels
                  val h = m.heightPixels
                  if (w == captureWidth && h == captureHeight) return
                  try {
                      val reader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                      reader.setOnImageAvailableListener({ r -> onFrameAvailable(r) }, captureHandler)
                      vd.resize(w, h, m.densityDpi)
                      vd.setSurface(reader.surface)
                      val old = imageReader
                      imageReader = reader
                      captureWidth = w
                      captureHeight = h
                      runCatching { old?.close() }
                  } catch (t: Throwable) {
                      setResult("屏幕尺寸变化后截屏重建失败，请打开 App 点第 ② 步重新授权。")
                  }
              }
          
              // ---------------- 缩小 / 展开（防遮挡屏幕） ----------------
          
              private fun minimize() {
                  if (!viewAdded || miniMode) return
                  runCatching { windowManager.removeView(floatView) }
                  viewAdded = false
                  if (miniView == null) createMiniView()
                  val mv = miniView
                  val mp = miniParams
                  if (mv != null && mp != null) {
                      runCatching { windowManager.addView(mv, mp) }
                      miniMode = true
                  }
              }
          
              private fun expand() {
                  if (!miniMode) return
                  runCatching { miniView?.let { windowManager.removeView(it) } }
                  runCatching { windowManager.addView(floatView, overlayParams) }
                  viewAdded = true
                  miniMode = false
                  // 恢复缩小前期望的焦点状态：若当时答案是可选中的，展开后仍应可选中复制
                  setSelectionEnabled(selectionAllowed)
              }
          
              private fun createMiniView() {
                  val ball = TextView(this).apply {
                      text = "答"
                      setTextColor(0xFFFFFFFF.toInt())
                      textSize = 20f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(COLOR_PRIMARY)
                      }
                  }
                  val params = WindowManager.LayoutParams(
                      dp(56), dp(56),
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = resources.displayMetrics.widthPixels - dp(70)
                      y = 400
                  }
                  var downX = 0f
                  var downY = 0f
                  var initX = 0
                  var initY = 0
                  var moved = false
                  ball.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = event.rawX; downY = event.rawY
                              initX = params.x; initY = params.y; moved = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (event.rawX - downX).toInt()
                              val dy = (event.rawY - downY).toInt()
                              if (kotlin.math.abs(dx) > 8 || kotlin.math.abs(dy) > 8) moved = true
                              params.x = initX + dx
                              params.y = initY + dy
                              runCatching { windowManager.updateViewLayout(ball, params) }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) expand()  // 几乎没移动 = 点击 → 展开
                              true
                          }
                          else -> false
                      }
                  }
                  miniView = ball
                  miniParams = params
              }
          
              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID, "答题助手", NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }
          
              private fun buildNotification(): Notification {
                  @Suppress("DEPRECATION")
                  fun legacyBuilder(): Notification.Builder = Notification.Builder(this)
                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL_ID)
                  } else {
                      legacyBuilder()
                  }
                  return builder
                      .setContentTitle("屏幕答题助手运行中")
                      .setContentText("切到题目页面后点悬浮窗按钮识别")
                      .setSmallIcon(android.R.drawable.ic_menu_search)
                      .setOngoing(true)
                      .build()
              }
          
              /** 只清 VirtualDisplay / ImageReader，不 stopSelf、不主动 stop projection */
              private fun teardownCapture() {
                  pendingFrame.set(false)
                  runCatching { virtualDisplay?.release() }
                  virtualDisplay = null
                  runCatching { imageReader?.close() }
                  imageReader = null
              }
          
              /** 完整释放：重新授权或服务销毁时调用 */
              private fun releaseProjection() {
                  teardownCapture()
                  runCatching { projection?.stop() }
                  projection = null
                  capturing.set(false)
              }
          
              override fun onDestroy() {
                  destroyed = true
                  pendingFrame.set(false)
                  releaseProjection()
                  if (viewAdded) {
                      runCatching { windowManager.removeView(floatView) }
                      viewAdded = false
                  }
                  if (miniMode) {
                      runCatching { miniView?.let { windowManager.removeView(it) } }
                      miniMode = false
                  }
                  runCatching { db.close() }
                  captureThread.quitSafely()
                  super.onDestroy()
              }
          
              override fun onBind(intent: Intent?): IBinder? = null
          
              private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()
          
              companion object {
                  const val EXTRA_RESULT_CODE = "resultCode"
                  const val EXTRA_DATA = "data"
                  private const val CHANNEL_ID = "screenqa"
                  private const val NOTIFICATION_ID = 1
                  // OCR 方向自适应：评分达到此值即认为方向正确、提前收敛（中文权重3、字母数字1）
                  // 阈值 80（约27个中文字符）：水印/状态栏等无关字符达不到，避免错方向误收敛
                  private const val OCR_ENOUGH_CHARS = 80
          
                  // 作业帮式配色：主色蓝、卡片白、正文深灰、解析灰
                  private val COLOR_PRIMARY = 0xFF4A90D9.toInt()
                  private val COLOR_CARD = 0xF5FFFFFF.toInt()
                  private val COLOR_TEXT = 0xFF222222.toInt()
                  private val COLOR_GRAY = 0xFF666666.toInt()
              }
          }
