                  super.onConfigurationChanged(newConfig)
                  // 旋转等配置变化时保持悬浮窗，不销毁；必要时刷新布局
                  if (viewAdded && ::floatView.isInitialized) {
                      runCatching { windowManager.updateViewLayout(floatView, overlayParams) }
                  }
              }
          
