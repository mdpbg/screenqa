              private fun minimize() {
                  if (!viewAdded || miniMode) return
                  runCatching { windowManager.removeView(floatView) }
                  viewAdded = false
                  if (miniView == null) createMiniView()
                  val mv = miniView
                  val mp = miniParams
                  if (mv != null && mp != null) {
                      runCatching { windowManager.addView(mv, mp) }
                      miniMode = true
                  }
              }
          
              private fun expand() {
                  if (!miniMode) return
                  runCatching { miniView?.let { windowManager.removeView(it) } }
                  runCatching { windowManager.addView(floatView, overlayParams) }
                  viewAdded = true
                  miniMode = false
              }
          
              private fun createMiniView() {
                  val ball = TextView(this).apply {
                      text = "答"
                      setTextColor(0xFFFFFFFF.toInt())
                      textSize = 20f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(COLOR_PRIMARY)
                      }
                  }
                  val params = WindowManager.LayoutParams(
                      dp(56), dp(56),
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = resources.displayMetrics.widthPixels - dp(70)
                      y = 400
                  }
                  var downX = 0f
                  var downY = 0f
                  var initX = 0
                  var initY = 0
                  var moved = false
                  ball.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = event.rawX; downY = event.rawY
                              initX = params.x; initY = params.y; moved = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (event.rawX - downX).toInt()
                              val dy = (event.rawY - downY).toInt()
                              if (kotlin.math.abs(dx) > 8 || kotlin.math.abs(dy) > 8) moved = true
                              params.x = initX + dx
                              params.y = initY + dy
                              runCatching { windowManager.updateViewLayout(ball, params) }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) expand()  // 几乎没移动 = 点击 → 展开
                              true
                          }
                          else -> false
                      }
                  }
                  miniView = ball
                  miniParams = params
              }
          
              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID, "答题助手", NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }
          
              private fun buildNotification(): Notification {
                  @Suppress("DEPRECATION")
                  fun legacyBuilder(): Notification.Builder = Notification.Builder(this)
                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL_ID)
                  } else {
                      legacyBuilder()
                  }
                  return builder
                      .setContentTitle("屏幕答题助手运行中")
                      .setContentText("切到题目页面后点悬浮窗按钮识别")
                      .setSmallIcon(android.R.drawable.ic_menu_search)
                      .setOngoing(true)
                      .build()
              }
          
              private fun releaseProjection() {
                  runCatching { virtualDisplay?.release() }
                  virtualDisplay = null
                  runCatching { imageReader?.close() }
                  imageReader = null
                  runCatching { projection?.stop() }
                  projection = null
                  capturing = false
              }
          
              override fun onDestroy() {
                  destroyed = true
                  releaseProjection()
                  if (viewAdded) {
                      runCatching { windowManager.removeView(floatView) }
                      viewAdded = false
                  }
                  if (miniMode) {
                      runCatching { miniView?.let { windowManager.removeView(it) } }
                      miniMode = false
                  }
                  runCatching { db.close() }
                  captureThread.quitSafely()
                  super.onDestroy()
              }
          
              override fun onBind(intent: Intent?): IBinder? = null
          
              private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()
          
              companion object {
                  const val EXTRA_RESULT_CODE = "resultCode"
                  const val EXTRA_DATA = "data"
                  private const val CHANNEL_ID = "screenqa"
                  private const val NOTIFICATION_ID = 1
          
