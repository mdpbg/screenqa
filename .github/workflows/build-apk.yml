                      setResult("没有识别到文字，换个页面再试。")
                      resetCaptureButton()
                      return
                  }
                  val questions = QuestionSplitter.split(cleaned)
                  if (questions.isEmpty()) {
                      setResult("没有识别到题目，换个页面再试。")
                      resetCaptureButton()
                      return
                  }
          
                  if (questions.size == 1) {
                      answerOne(questions[0]) { ans ->
                          setResult(ans)
                          resetCaptureButton()
                      }
                      return
                  }
          
