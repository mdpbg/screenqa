                          }
                          try {
                              ContextCompat.startForegroundService(this, serviceIntent)
                              statusText.text = "已授权，悬浮窗已启动。现在可以切到题目页面使用了。"
                          } catch (e: SecurityException) {
                              statusText.text = "启动失败：${e.message}。请确认通知与悬浮窗权限都已开启。"
                          }
                      } else {
                          statusText.text = "已取消授权，悬浮窗未启动。"
                      }
                  }
          
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  projectionManager = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  buildUi()
                  requestNotificationPermissionIfNeeded()
                  refreshStatus()
              }
          
              override fun onResume() {
                  super.onResume()
                  refreshStatus()
              }
          
              private fun buildUi() {
                  fun lp() = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { topMargin = dp(12) }
          
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(24), dp(32), dp(24), dp(24))
                  }
          
                  val title = TextView(this).apply {
                      text = "屏幕答题助手"
                      textSize = 22f
                      setTypeface(null, Typeface.BOLD)
                  }
                  val intro = TextView(this).apply {
                      text = "截屏 → OCR 识别题目 → 先查本地题库 → 未命中再问 AI。\n建议用于课后练习自测。"
                      textSize = 13f
                  }
                  statusText = TextView(this).apply {
                      textSize = 14f
                      setPadding(0, dp(12), 0, dp(12))
                  }
                  val overlayButton = Button(this).apply {
                      text = "① 开启悬浮窗权限"
                      setOnClickListener { openOverlaySettings() }
                  }
                  val startButton = Button(this).apply {
                      text = "② 授权屏幕捕获并启动悬浮窗"
                      setOnClickListener { startCapture() }
                  }
                  val stopButton = Button(this).apply {
                      text = "停止悬浮窗"
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, FloatService::class.java))
                          toast("已停止")
                          refreshStatus()
                      }
                  }
                  val keyTitle = TextView(this).apply {
                      text = "DeepSeek API Key（可选，仅 AI 兜底需要）"
                      textSize = 13f
                  }
                  keyInput = EditText(this).apply {
                      hint = "sk-... 填写后点保存，只保存在本机 App 内"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      setText(AiClient.readKey(this@MainActivity))
                  }
                  val saveKeyButton = Button(this).apply {
                      text = "保存 Key"
                      setOnClickListener {
                          AiClient.saveKey(this@MainActivity, keyInput.text.toString())
                          toast("已保存")
                          refreshStatus()
                      }
                  }
                  val tip = TextView(this).apply {
                      text = "用法：授权后切到其他 App，点悬浮窗上的「识别当前屏幕」。\n" +
                          "修改 assets/qa.csv 后，需把 QaDb 里的 DB_VERSION 加 1 才会重新导入。"
                      textSize = 12f
                  }
          
                  root.addView(title, lp())
                  root.addView(intro, lp())
                  root.addView(statusText, lp())
                  root.addView(overlayButton, lp())
                  root.addView(startButton, lp())
                  root.addView(stopButton, lp())
                  root.addView(keyTitle, lp())
                  root.addView(keyInput, lp())
                  root.addView(saveKeyButton, lp())
                  root.addView(tip, lp())
                  setContentView(root)
              }
          
              private fun startCapture() {
                  if (!Settings.canDrawOverlays(this)) {
                      toast("请先开启悬浮窗权限")
                      openOverlaySettings()
                      return
                  }
                  if (notificationsDenied()) {
                      toast("请先允许通知权限")
                      requestNotificationPermissionIfNeeded()
                      return
                  }
                  captureLauncher.launch(projectionManager.createScreenCaptureIntent())
              }
          
              private fun openOverlaySettings() {
                  startActivity(
                      Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                  )
              }
          
              private fun notificationsDenied(): Boolean =
                  Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) !=
                      PackageManager.PERMISSION_GRANTED
          
              private fun requestNotificationPermissionIfNeeded() {
                  if (notificationsDenied()) {
                      notificationPermission.launch(Manifest.permission.POST_NOTIFICATIONS)
                  }
              }
          
              private fun refreshStatus() {
                  val overlay = Settings.canDrawOverlays(this)
                  val notify = !notificationsDenied()
                  val key = AiClient.isConfigured(this)
                  statusText.text = buildString {
                      append("悬浮窗权限：").append(if (overlay) "已开启" else "未开启").append('\n')
                      append("通知权限：").append(if (notify) "已开启" else "未开启").append('\n')
                      append("API Key：").append(if (key) "已配置" else "未配置（仅题库可用）")
                      append("\n\n")
                      append(if (overlay && notify) "可以点第 ② 步启动了。" else "请先完成上面的权限开启。")
                  }
              }
          
              private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()
          
              private fun toast(message: String) {
                  Toast.makeText(this, message, Toast.LENGTH_SHORT).show()
              }
          }
