      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 不使用 android-actions/setup-android@v3：该 action 默认安装 Google 早已从 SDK 仓库
      # 下架的旧 "tools" 包，2026 年起在 GitHub runner 上必然报
      # "Failed to find package 'tools'" 并退出 1，导致整个 job 在编译前就失败。
      # ubuntu-latest 镜像已预装完整 Android SDK 与所需平台/构建工具，直接用即可。
      - name: 定位预装 Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            for cand in /usr/local/lib/android/sdk /usr/lib/android-sdk "$HOME/Android/Sdk"; do
              if [ -d "$cand" ]; then SDK_ROOT="$cand"; break; fi
            done
          fi
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::找不到预装 Android SDK"
            ls -la /usr/local/lib/android 2>/dev/null || true
            exit 1
          fi
          # cmdline-tools 子目录名带版本号，不能写死 latest，动态查找
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::找不到 sdkmanager，SDK 目录内容："
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "SDK_ROOT=$SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          # AGP 通过 local.properties 或 ANDROID_HOME 定位 SDK，两处都给，避免 SDK location not found
          echo "sdk.dir=$SDK_ROOT" > local.properties
          cat local.properties
          java -version

      - name: 校验并补齐 SDK 组件
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          INSTALLED="$("$SDKMANAGER" --list_installed || true)"
          echo "=== runner 已安装组件 ==="
          echo "$INSTALLED" | head -30 || true
          MISSING=()
          for pkg in "platforms;android-35" "build-tools;35.0.0" "platform-tools"; do
            if ! echo "$INSTALLED" | grep -qF "$pkg"; then MISSING+=("$pkg"); fi
          done
          if [ ${#MISSING[@]} -eq 0 ]; then
            echo "所需 SDK 组件已全部预装，跳过下载"
          else
            echo "需要补装：${MISSING[*]}"
            "$SDKMANAGER" --install "${MISSING[@]}"
          fi

      - name: 编译 Debug APK（自动 debug 签名，手机可直接安装）
        env:
          # 可选：不配置也能用，Key 可以在手机上打开 App 自行填写
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -o pipefail
          if ! command -v gradle > /dev/null 2>&1; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
            export PATH="/tmp/gradle-dist/gradle-8.9/bin:$PATH"
          fi
          gradle --version
          # 不加 --stacktrace：几屏长的堆栈会把真正的错误信息挤出可视区域
          set +e
          gradle :app:assembleDebug --no-daemon 2>&1 | tee /tmp/gradle-build.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            cp /tmp/gradle-build.log gradle-build.log
            echo "::group::===== 编译失败原因摘要（把这一段发我即可）====="
            grep -nE "FAILURE:|What went wrong|^e: |Execution failed for task|Could not (resolve|find|get|download)|Caused by:|SDK location not found|Unresolved reference|error:|^> Task .*FAILED" /tmp/gradle-build.log | head -80 || true
            echo "---- What went wrong 上下文 ----"
            grep -n -A 8 "What went wrong" /tmp/gradle-build.log | head -30 || true
            echo "::endgroup::"
            echo "::error::编译失败，完整日志见 artifact：gradle-build-log"
            exit "$RC"
          fi

      - name: 上传完整编译日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: 整理产物
        run: cp app/build/outputs/apk/debug/app-debug.apk ScreenQA.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ScreenQA-apk
          path: ScreenQA.apk

      # 关键：artifact 是 zip，手机不好解压；Release 挂的是裸 .apk，手机浏览器点开即可安装
      - name: 发布可直接下载的 APK 直链
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ScreenQA 构建 #${{ github.run_number }}
          files: ScreenQA.apk
          body: |
            云端自动编译的 debug 签名 APK，Android 10+ 手机可直接下载安装。
            若手机已安装旧版本，请先卸载再安装（云端每次构建的 debug 签名不同，无法直接覆盖）。
            安装后：打开 App → ①开启悬浮窗权限 → ②授权屏幕捕获并启动 → 切到题目页面点「识别当前屏幕」。
