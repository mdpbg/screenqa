                  val results = arrayOfNulls<String>(questions.size)
                  val remaining = AtomicInteger(questions.size)
                  setResult("识别到 ${questions.size} 道题，逐题解答中…")
                  questions.forEachIndexed { i, q ->
                      answerOne(q) { ans ->
                          results[i] = "【第${i + 1}题】\n$ans"
                          val left = remaining.decrementAndGet()
                          if (left == 0) {
                              setResult(results.joinToString("\n\n────────────────\n\n"))
                              resetCaptureButton()
                          } else {
                              setResult("已解答 ${questions.size - left}/${questions.size} 题…")
                          }
                      }
                  }
