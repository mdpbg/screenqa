          package com.example.screenqa
          
          import android.content.Context
          import okhttp3.Call
          import okhttp3.Callback
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import okhttp3.Response
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.util.concurrent.TimeUnit
          
          /**
           * AI 兜底：DeepSeek（兼容 OpenAI chat/completions 格式）。
           * Key 优先取手机上 App 内填写的值，其次取构建时注入的 BuildConfig 值。
           * 回调在 OkHttp 的工作线程执行，调用方需自行切回主线程更新 UI。
           */
          object AiClient {
          
              private const val URL = "https://api.deepseek.com/chat/completions"
              private const val PREF_NAME = "screenqa_prefs"
              private const val PREF_KEY = "deepseek_api_key"
          
              private val client = OkHttpClient.Builder()
                  .connectTimeout(15, TimeUnit.SECONDS)
                  .readTimeout(60, TimeUnit.SECONDS)
                  .writeTimeout(30, TimeUnit.SECONDS)
                  .build()
          
              fun readKey(context: Context): String =
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .getString(PREF_KEY, null)
                      ?.takeIf { it.isNotBlank() }
                      ?: BuildConfig.DEEPSEEK_API_KEY
          
              fun saveKey(context: Context, key: String) {
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .edit()
                      .putString(PREF_KEY, key.trim())
                      .apply()
              }
          
              fun isConfigured(context: Context): Boolean = readKey(context).isNotBlank()
          
              fun ask(context: Context, question: String, callback: (String) -> Unit) {
                  val key = readKey(context)
                  if (key.isBlank()) {
                      callback("未配置 API Key：请打开 App 填写并保存 DeepSeek Key。题库命中不受影响。")
                      return
                  }
          
                  // 用 JSONObject 构造请求体，避免手工拼接 JSON 时的转义问题
                  val requestBody = JSONObject().apply {
                      put("model", "deepseek-chat")
                      put("temperature", 0)
                      put("messages", JSONArray().apply {
                          put(JSONObject().apply {
                              put("role", "system")
                              put("content", "你是答题助手，用于课后练习自测。只给最终答案，以及不超过两行的简要解析。")
                          })
                          put(JSONObject().apply {
                              put("role", "user")
                              put("content", question.take(4000))
                          })
                      })
                  }.toString()
          
                  val request = Request.Builder()
                      .url(URL)
                      .header("Authorization", "Bearer $key")
                      .post(requestBody.toRequestBody("application/json; charset=utf-8".toMediaType()))
                      .build()
          
                  client.newCall(request).enqueue(object : Callback {
                      override fun onFailure(call: Call, e: IOException) {
                          callback("AI 请求失败：${e.message ?: "网络异常，请检查网络"}")
                      }
          
                      override fun onResponse(call: Call, response: Response) {
                          response.use { resp ->
                              val body = resp.body?.string().orEmpty()
                              val answer = if (!resp.isSuccessful) {
                                  "AI 接口 HTTP ${resp.code}：${body.take(200)}"
                              } else {
                                  try {
                                      JSONObject(body)
                                          .getJSONArray("choices")
                                          .getJSONObject(0)
                                          .getJSONObject("message")
                                          .getString("content")
                                          .trim()
                                          .ifEmpty { "AI 返回空内容" }
                                  } catch (e: Exception) {
                                      "解析失败：${body.take(200)}"
                                  }
                              }
                              callback(answer)
                          }
                      }
                  })
              }
          }
          SQEOF_5
          cat > app/src/main/java/com/example/screenqa/FloatService.kt <<'SQEOF_6'
          package com.example.screenqa
          
          import android.app.Activity
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.chinese.ChineseTextRecognizerOptions
          import java.util.concurrent.atomic.AtomicBoolean
          
          /**
           * 悬浮窗 + 截屏 + OCR + 查库 / AI。
           * Android 14 起：必须先以 mediaProjection 类型进入前台，再 getMediaProjection()，
           * 且 createVirtualDisplay() 之前必须注册 MediaProjection.Callback，否则抛异常。
           */
          class FloatService : Service() {
          
              private lateinit var windowManager: WindowManager
              private lateinit var floatView: View
              private lateinit var resultText: TextView
              private lateinit var overlayParams: WindowManager.LayoutParams
              private lateinit var db: QaDb
              private lateinit var mainHandler: Handler
              private lateinit var captureHandler: Handler
              private val captureThread = HandlerThread("ScreenQaCapture").apply { start() }
          
              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private var viewAdded = false
              private var pendingResult: String? = null
          
              @Volatile
              private var capturing = false
          
              private val recognizer by lazy {
                  TextRecognition.getClient(ChineseTextRecognizerOptions.Builder().build())
              }
          
              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  db = QaDb(this)
                  mainHandler = Handler(Looper.getMainLooper())
                  captureHandler = Handler(captureThread.looper)
              }
          
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  createNotificationChannel()
          
                  // 显式带类型，满足 Android 10+ / 14 的前台服务约束；必须先于 getMediaProjection
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(
                          NOTIFICATION_ID, buildNotification(),
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION
                      )
                  } else {
                      startForeground(NOTIFICATION_ID, buildNotification())
                  }
          
                  @Suppress("DEPRECATION")
                  fun legacyData(): Intent? = intent?.getParcelableExtra(EXTRA_DATA)
          
                  val code = intent?.getIntExtra(EXTRA_RESULT_CODE, Activity.RESULT_CANCELED)
                      ?: Activity.RESULT_CANCELED
                  val data: Intent? = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      intent?.getParcelableExtra(EXTRA_DATA, Intent::class.java)
                  } else {
                      legacyData()
                  }
          
                  if (code == Activity.RESULT_OK && data != null) {
                      releaseProjection()
                      try {
                          val manager = getSystemService(Context.MEDIA_PROJECTION_SERVICE)
                              as MediaProjectionManager
                          projection = manager.getMediaProjection(code, data)
                          projection?.registerCallback(object : MediaProjection.Callback() {
                              override fun onStop() {
                                  stopSelf()
                              }
                          }, mainHandler)
                      } catch (e: SecurityException) {
                          projection = null
                          setResult("屏幕捕获授权已失效，请打开 App 重新授权一次。\n${e.message.orEmpty()}")
                      }
                  } else {
                      setResult("缺少屏幕捕获授权，请打开 App 点第 ② 步重新授权。")
                  }
          
                  if (!viewAdded) addFloatView()
                  // Android 14+ 的授权令牌只能消费一次，服务被重建后必须重新授权，故不用 START_STICKY
                  return START_NOT_STICKY
              }
          
              private fun addFloatView() {
                  val header = TextView(this).apply {
                      text = "≡ 屏幕答题助手（按住拖动）"
                      setTextColor(0xFFFFFFFF.toInt())
                      textSize = 13f
                      setBackgroundColor(0xFF2B2B2B.toInt())
                      setPadding(16, 10, 16, 10)
                  }
                  val captureButton = Button(this).apply {
                      text = "识别当前屏幕"
                      setOnClickListener { captureScreen() }
                  }
                  val closeButton = Button(this).apply {
                      text = "关闭"
                      setOnClickListener { stopSelf() }
                  }
                  resultText = TextView(this).apply {
                      setTextColor(0xFFFFFFFF.toInt())
                      textSize = 14f
                      setPadding(16, 12, 16, 16)
                      maxWidth = (resources.displayMetrics.widthPixels * 0.85f).toInt()
                      text = "等待识别…"
                  }
                  val buttonRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      addView(
                          captureButton,
                          LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      )
                      addView(
                          closeButton,
                          LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      )
                  }
                  floatView = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xDD111111.toInt())
                      addView(
                          header,
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                      )
                      addView(
                          buttonRow,
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                      )
                      addView(
                          resultText,
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                      )
                  }
          
                  overlayParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else
                          WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 40
                      y = 200
                  }
          
                  var initialX = 0
                  var initialY = 0
                  var downX = 0f
                  var downY = 0f
                  header.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = overlayParams.x
                              initialY = overlayParams.y
                              downX = event.rawX
                              downY = event.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              overlayParams.x = initialX + (event.rawX - downX).toInt()
                              overlayParams.y = initialY + (event.rawY - downY).toInt()
                              if (viewAdded) {
                                  runCatching { windowManager.updateViewLayout(floatView, overlayParams) }
                              }
                              true
                          }
                          else -> false
                      }
                  }
          
                  runCatching {
                      windowManager.addView(floatView, overlayParams)
                      viewAdded = true
                  }.onFailure {
                      setResult("悬浮窗添加失败：${it.message}")
                  }
                  pendingResult?.let {
                      resultText.text = it
                      pendingResult = null
                  }
              }
          
              private fun captureScreen() {
                  if (capturing) return
                  val p = projection ?: run {
                      setResult("没有屏幕捕获权限，请打开 App 重新授权一次。")
                      return
                  }
                  val metrics = resources.displayMetrics
                  val width = metrics.widthPixels
                  val height = metrics.heightPixels
                  val reader = ImageReader.newInstance(width, height, PixelFormat.RGBA_8888, 2)
                  imageReader = reader
                  val consumed = AtomicBoolean(false)
          
                  try {
                      virtualDisplay = p.createVirtualDisplay(
                          "ScreenQaCapture", width, height, metrics.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          reader.surface, null, null
                      )
                  } catch (e: Exception) {
                      setResult("创建截屏失败：${e.message}")
                      runCatching { reader.close() }
                      imageReader = null
                      return
                  }
          
                  capturing = true
                  setResult("正在截屏并识别…")
                  reader.setOnImageAvailableListener({ r ->
                      if (!consumed.compareAndSet(false, true)) return@setOnImageAvailableListener
                      val image = r.acquireLatestImage()
                      if (image == null) {
                          consumed.set(false)
                          return@setOnImageAvailableListener
                      }
                      val bitmap = runCatching { imageToBitmap(image) }.getOrNull()
                      image.close()
                      mainHandler.post {
                          runCatching { virtualDisplay?.release() }
                          virtualDisplay = null
                          runCatching { r.close() }
                          if (imageReader === r) imageReader = null
                          capturing = false
                          if (bitmap == null) setResult("截屏数据为空，请重试。") else runOcr(bitmap)
                      }
                  }, captureHandler)
              }
          
              /** 必须处理 rowStride / pixelStride，否则部分机型截出来的图是斜的 */
              private fun imageToBitmap(image: Image): Bitmap {
                  val plane = image.planes[0]
                  val pixelStride = plane.pixelStride
                  val rowStride = plane.rowStride
                  val rowPadding = rowStride - pixelStride * image.width
                  val paddedWidth = image.width + rowPadding / pixelStride
                  val raw = Bitmap.createBitmap(paddedWidth, image.height, Bitmap.Config.ARGB_8888)
                  raw.copyPixelsFromBuffer(plane.buffer)
                  return if (rowPadding == 0) {
                      raw
                  } else {
                      Bitmap.createBitmap(raw, 0, 0, image.width, image.height)
                  }
              }
          
              private fun runOcr(bitmap: Bitmap) {
                  recognizer.process(InputImage.fromBitmap(bitmap, 0))
                      .addOnSuccessListener { visionText ->
                          bitmap.recycle()
                          handleQuestion(visionText.text)
                      }
                      .addOnFailureListener { e ->
                          bitmap.recycle()
                          setResult("OCR 失败：${e.message}")
                      }
              }
          
              private fun handleQuestion(ocrText: String) {
                  val cleaned = ocrText.trim()
                  if (cleaned.isEmpty()) {
                      setResult("没有识别到文字，换个页面再试。")
                      return
                  }
                  val localAnswer = db.search(cleaned)
                  if (localAnswer != null) {
                      setResult("【题库命中】\n$localAnswer")
                      return
                  }
                  if (!AiClient.isConfigured(this)) {
                      setResult("题库未命中，且未配置 API Key。\n请打开 App 填写 DeepSeek Key。\n\n识别到的文字：${cleaned.take(120)}")
                      return
                  }
                  setResult("题库未命中，AI 解答中…")
                  AiClient.ask(this, cleaned) { answer ->
                      mainHandler.post { setResult("【AI】\n$answer") }
                  }
              }
          
              private fun setResult(text: String) {
                  val task = {
                      if (::resultText.isInitialized) {
                          resultText.text = text
                      } else {
                          pendingResult = text
                      }
                  }
                  if (Looper.myLooper() == Looper.getMainLooper()) task() else mainHandler.post(task)
              }
          
              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID, "答题助手", NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }
          
              private fun buildNotification(): Notification {
                  @Suppress("DEPRECATION")
                  fun legacyBuilder(): Notification.Builder = Notification.Builder(this)
                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL_ID)
                  } else {
                      legacyBuilder()
                  }
                  return builder
                      .setContentTitle("屏幕答题助手运行中")
                      .setContentText("切到题目页面后点悬浮窗按钮识别")
                      .setSmallIcon(android.R.drawable.ic_menu_search)
                      .setOngoing(true)
                      .build()
              }
          
              private fun releaseProjection() {
                  runCatching { virtualDisplay?.release() }
                  virtualDisplay = null
                  runCatching { imageReader?.close() }
                  imageReader = null
                  runCatching { projection?.stop() }
                  projection = null
                  capturing = false
              }
          
              override fun onDestroy() {
                  releaseProjection()
                  if (viewAdded) {
                      runCatching { windowManager.removeView(floatView) }
                      viewAdded = false
                  }
                  runCatching { db.close() }
                  captureThread.quitSafely()
                  super.onDestroy()
              }
          
              override fun onBind(intent: Intent?): IBinder? = null
          
              companion object {
                  const val EXTRA_RESULT_CODE = "resultCode"
                  const val EXTRA_DATA = "data"
                  private const val CHANNEL_ID = "screenqa"
                  private const val NOTIFICATION_ID = 1
              }
          }
