          package com.example.screenqa
          
          import android.content.Context
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper
          import java.text.Normalizer
          
          /**
           * 本地题库：首次启动从 assets/qa.csv 导入示例题库。
           * 之后用户在 App 内导入的文件通过 insertBatch() 追加/覆盖，无需重新编译或改版本号。
           * DB_VERSION 仅在表结构变更时才需要递增。
           */
          class QaDb(context: Context) :
              SQLiteOpenHelper(context.applicationContext, DB_NAME, null, DB_VERSION) {
          
              private val appContext = context.applicationContext
          
              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL(
                      "CREATE TABLE qa (" +
                          "id INTEGER PRIMARY KEY AUTOINCREMENT, " +
                          "question TEXT NOT NULL, " +
                          "answer TEXT NOT NULL)"
                  )
                  runCatching {
                      appContext.assets.open(CSV_FILE).bufferedReader(Charsets.UTF_8).use { reader ->
                          reader.readLines()
                              .drop(1) // 跳过表头
                              .filter { it.isNotBlank() }
                              .forEach { line ->
                                  val row = parseCsvLine(line)
                                  if (row.size >= 2 && row[0].isNotBlank()) {
                                      db.execSQL(
                                          "INSERT INTO qa(question, answer) VALUES(?,?)",
                                          arrayOf(normalize(row[0]), TextCleaner.clean(row[1]).trim())
                                      )
                                  }
                              }
                      }
                  }
              }
          
              /** 精确匹配 → 题库题目被 OCR 文本包含 → OCR 文本被题库题目包含 */
              fun search(ocrText: String): String? {
                  val q = normalize(ocrText)
                  if (q.isEmpty()) return null
                  val db = readableDatabase
          
                  db.rawQuery(
                      "SELECT answer FROM qa WHERE question = ? LIMIT 1", arrayOf(q)
                  ).use { c -> if (c.moveToFirst()) return c.getString(0) }
          
                  db.rawQuery(
                      "SELECT answer FROM qa WHERE ? LIKE '%' || question || '%' " +
                          "ORDER BY length(question) DESC LIMIT 1",
                      arrayOf(q)
                  ).use { c -> if (c.moveToFirst()) return c.getString(0) }
          
                  // 反向包含：OCR 文本太短时容易误命中，加一个长度下限
                  if (q.length >= 4) {
                      db.rawQuery(
                          "SELECT answer FROM qa WHERE question LIKE ? ESCAPE '\\' " +
                              "ORDER BY length(question) ASC LIMIT 1",
                          arrayOf("%" + escapeLike(q) + "%")
                      ).use { c -> if (c.moveToFirst()) return c.getString(0) }
                  }
                  return null
              }
          
              private fun escapeLike(s: String): String =
                  s.replace("\\", "\\\\").replace("%", "\\%").replace("_", "\\_")
          
              /** 全角转半角、去空白与标点、转小写，抵消 OCR 的细微差异 */
              private fun normalize(s: String): String =
                  Normalizer.normalize(s, Normalizer.Form.NFKC)
                      .lowercase()
                      .replace(Regex("[\\s\\p{Punct}\\u3000-\\u303F\\uFF01-\\uFF65]"), "")
          
              /** 支持英文双引号包裹、字段内含逗号、两个连续双引号表示一个字面引号 */
              private fun parseCsvLine(line: String): List<String> {
                  val result = mutableListOf<String>()
                  val field = StringBuilder()
                  var quoted = false
                  var i = 0
                  while (i < line.length) {
                      val ch = line[i]
                      when {
                          ch == '"' -> {
                              if (quoted && i + 1 < line.length && line[i + 1] == '"') {
                                  field.append('"')
                                  i++
                              } else {
                                  quoted = !quoted
                              }
                          }
                          ch == ',' && !quoted -> {
                              result.add(field.toString())
                              field.setLength(0)
                          }
                          else -> field.append(ch)
                      }
                      i++
                  }
                  result.add(field.toString())
                  return result.map { it.trim().removePrefix("\uFEFF") }
              }
          
              /** 批量导入：按归一化后的题目去重（同题新答案覆盖旧答案），返回写入条数 */
              fun insertBatch(pairs: List<Pair<String, String>>): Int {
                  if (pairs.isEmpty()) return 0
                  val db = writableDatabase
                  var count = 0
                  db.beginTransaction()
                  try {
                      pairs.forEach { (q, a) ->
                          val nq = normalize(q)
                          if (nq.isNotEmpty() && a.isNotBlank()) {
                              db.execSQL("DELETE FROM qa WHERE question = ?", arrayOf(nq))
                              db.execSQL(
                                  "INSERT INTO qa(question, answer) VALUES(?,?)",
                                  arrayOf(nq, TextCleaner.clean(a).trim())
                              )
                              count++
                          }
                      }
                      db.setTransactionSuccessful()
                  } finally {
                      db.endTransaction()
                  }
                  return count
              }
          
              fun clearAll() {
                  writableDatabase.execSQL("DELETE FROM qa")
              }
          
              fun count(): Int =
                  readableDatabase.rawQuery("SELECT COUNT(*) FROM qa", null).use { c ->
                      if (c.moveToFirst()) c.getInt(0) else 0
                  }
          
              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {
                  db.execSQL("DROP TABLE IF EXISTS qa")
                  onCreate(db)
              }
          
              companion object {
                  private const val DB_NAME = "qa.db"
                  private const val DB_VERSION = 1
                  private const val CSV_FILE = "qa.csv"
              }
          }
          SQEOF_10
          cat > app/src/main/java/com/example/screenqa/QuestionSplitter.kt <<'SQEOF_11'
          package com.example.screenqa
          
          /**
           * 把一屏 OCR 文本拆成多道题。
           * 题目起始行特征：行首题号（1. / 2、 / （1）/ 第3题）或【单选题】等题型标记。
           * 选项 A. B. C. 是字母开头，不会被误当题号。
           * 没有明显题号时整屏按一道题处理。
           */
          object QuestionSplitter {
          
              private val QUESTION_START = Regex(
                  "^(\\d{1,4}[.、．]\\s*\\S|[（(]\\d{1,4}[)）]|第\\d+题|【[^】]*题[^】]*】)"
              )
          
              fun split(ocrText: String): List<String> {
                  val lines = ocrText.lines().map { it.trim() }.filter { it.isNotEmpty() }
                  if (lines.isEmpty()) return emptyList()
          
                  val starts = lines.indices.filter { QUESTION_START.containsMatchIn(lines[it]) }
                  if (starts.size <= 1) return listOf(ocrText.trim())
          
                  val out = mutableListOf<String>()
                  for (k in starts.indices) {
                      val from = starts[k]
                      val to = if (k + 1 < starts.size) starts[k + 1] else lines.size
                      val q = lines.subList(from, to).joinToString("\n").trim()
                      if (q.isNotEmpty()) out += q
                  }
                  return if (out.isEmpty()) listOf(ocrText.trim()) else out
              }
          }
          SQEOF_11
          cat > app/src/main/java/com/example/screenqa/TextCleaner.kt <<'SQEOF_12'
          package com.example.screenqa
          
          /**
           * 文本清洗：去掉导致显示乱码的不可见字符，并清理 AI 答案里的 Markdown 符号。
           * 题库答案、AI 答案在显示前统一过一遍，避免"答案乱码"。
           */
          object TextCleaner {
          
              /** 去除 BOM、零宽字符、控制字符、\r；不换行空格转普通空格；保留 \n 和 \t */
              fun clean(s: String): String {
                  if (s.isEmpty()) return s
                  val sb = StringBuilder(s.length)
                  for (ch in s) {
                      when {
                          // 零宽字符 / BOM —— 直接删除
                          ch == '\uFEFF' || ch == '\u200B' || ch == '\u200C' ||
                              ch == '\u200D' || ch == '\u2060' -> {
                          }
                          // 不换行空格（常见于 PDF/网页复制）转普通空格，避免显示成方框
                          ch == '\u00A0' -> sb.append(' ')
                          ch == '\r' -> {
                          }
                          // 其他控制字符删除，但保留换行和制表符
                          ch.isISOControl() && ch != '\n' && ch != '\t' -> {
                          }
                          else -> sb.append(ch)
                      }
                  }
                  return sb.toString()
              }
          
              /** AI 答案专用：额外去掉 Markdown 标记（** 粗体、## 标题、``` 代码块、列表符号） */
              fun cleanAnswer(s: String): String {
                  var t = clean(s)
                  t = t.replace("```", "")
                  t = t.replace(Regex("\\*\\*(.+?)\\*\\*", RegexOption.DOT_MATCHES_ALL), "$1")
                  t = t.replace(Regex("(?m)^\\s*#{1,6}\\s*"), "")
                  t = t.replace(Regex("(?m)^\\s*[-*+]\\s+"), "")
                  return t.trim()
              }
          }
          SQEOF_12
