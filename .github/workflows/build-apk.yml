                  // 扩展名只是"提示"：拿不到或不对时传空串，由 BankImporter 用 MIME + 文件头嗅探兜底。
                  // 不再因为取不到文件名就直接判"不支持的格式"（微信/第三方文件管理器常见）。
                  val ext = name.substringAfterLast('.', "").lowercase()
                  importing = true
                  importResultText.text = "正在导入 $name ..."
                  thread {
                      try {
                          val result = BankImporter.import(this, uri, ext)
                          val added = if (result.error == null) db.insertBatch(result.pairs) else 0
                          runOnUiThread {
                              importing = false
                              importResultText.text = if (result.error != null) {
                                  "导入失败：${result.error}"
                              } else {
