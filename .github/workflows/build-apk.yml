          package com.example.screenqa
          
          import android.app.Application
          import android.content.Context
          import android.content.Intent
          import android.os.Process
          import java.io.File
          import java.io.PrintWriter
          import java.io.StringWriter
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.system.exitProcess
          
          /**
           * 全局崩溃防护：任何未捕获异常（含子线程的 OutOfMemoryError 等）先写日志，
           * 再自动重启主界面 —— 把"莫名闪退"变成"自动回到 App"，避免考试中途退出。
           * 10 秒内重复崩溃则不重启，防止崩溃死循环。
           */
          class QaApp : Application() {
          
              override fun onCreate() {
                  super.onCreate()
                  Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->
                      runCatching { writeCrashLog(thread, throwable) }
                      if (markCrashAndShouldRestart()) {
                          runCatching {
                              startActivity(Intent(this, MainActivity::class.java).apply {
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK)
                              })
                          }
                      }
                      Process.killProcess(Process.myPid())
                      exitProcess(10)
                  }
              }
          
              private fun writeCrashLog(thread: Thread, throwable: Throwable) {
                  val sw = StringWriter()
                  throwable.printStackTrace(PrintWriter(sw))
                  val time = SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.getDefault()).format(Date())
                  val log = "==== $time  线程:${thread.name}  ${throwable.javaClass.name} ====\n$sw\n\n"
                  crashLogFile(this).appendText(log)
              }
          
              /** 记录崩溃时间；距上次崩溃不足 10 秒则返回 false（不重启，避免循环） */
              private fun markCrashAndShouldRestart(): Boolean {
                  val sp = getSharedPreferences("crash_guard", MODE_PRIVATE)
                  val now = System.currentTimeMillis()
                  val last = sp.getLong("last_crash", 0L)
                  sp.edit().putLong("last_crash", now).apply()
                  return now - last > 10_000
              }
          
              companion object {
                  fun crashLogFile(context: Context): File = File(context.filesDir, "crash.log")
              }
          }
