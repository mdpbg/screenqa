      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 安装 Android SDK 命令行工具
        uses: android-actions/setup-android@v3

      - name: 接受许可并安装编译组件
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: 编译 Debug APK（自动 debug 签名，手机可直接安装）
        env:
          # 可选：不配置也能用，Key 可以在手机上打开 App 自行填写
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if ! command -v gradle > /dev/null 2>&1; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
            export PATH="/tmp/gradle-dist/gradle-8.9/bin:$PATH"
          fi
          gradle --version
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 整理产物
        run: cp app/build/outputs/apk/debug/app-debug.apk ScreenQA.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ScreenQA-apk
          path: ScreenQA.apk

      # 关键：artifact 是 zip，手机不好解压；Release 挂的是裸 .apk，手机浏览器点开即可安装
      - name: 发布可直接下载的 APK 直链
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ScreenQA 构建 #${{ github.run_number }}
          files: ScreenQA.apk
          body: 云端自动编译的 debug 签名 APK，Android 10+ 手机可直接下载安装。
