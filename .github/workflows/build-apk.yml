              /** 单题作答：先查本地题库，未命中再问 AI。callback 保证只被调用一次。 */
              private fun answerOne(question: String, callback: (String) -> Unit) {
                  if (destroyed) {
                      callback("")
                      return
                  }
                  val local = runCatching { db.search(question) }.getOrNull()
                  if (local != null) {
                      callback("【答案】\n${TextCleaner.clean(local).trim()}")
                      return
                  }
                  if (!AiClient.isConfigured(this)) {
                      callback("【答案】\n题库未命中，且未配置 API Key（打开 App 填写 DeepSeek Key 后可 AI 解答）")
                      return
                  }
                  AiClient.ask(this, question) { ans ->
                      mainHandler.post {
                          if (!destroyed) callback(ans)
                      }
                  }
              }
          
              // ---------------- 结果展示（答案蓝色加粗、解析灰色） ----------------
          
              private fun setResult(text: String) {
                  val task = {
                      if (::resultText.isInitialized) {
                          resultText.text = styleText(TextCleaner.clean(text))
                      } else {
                          pendingResult = text
                      }
                  }
                  if (Looper.myLooper() == Looper.getMainLooper()) task() else mainHandler.post(task)
              }
          
              private fun styleText(text: String): CharSequence {
                  val ssb = SpannableStringBuilder(text)
                  fun color(regex: Regex, colorInt: Int, bold: Boolean) {
                      regex.findAll(text).forEach { m ->
                          ssb.setSpan(
                              ForegroundColorSpan(colorInt),
                              m.range.first, m.range.last + 1, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                          )
                          if (bold) ssb.setSpan(
                              StyleSpan(Typeface.BOLD),
                              m.range.first, m.range.last + 1, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                          )
                      }
                  }
                  color(Regex("【第\\d+题】"), COLOR_PRIMARY, true)
                  color(Regex("【答案】"), COLOR_PRIMARY, true)
                  color(Regex("【题库】"), COLOR_PRIMARY, true)
                  color(Regex("【解析】"), COLOR_GRAY, false)
                  return ssb
              }
          
