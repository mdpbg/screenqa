name: 云端编译 ScreenQA APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 展开工程源码
        run: |
          set -e
          mkdir -p app app/src/main app/src/main/assets app/src/main/java/com/example/screenqa app/src/main/res/values
          cat > .gitignore <<'SQEOF_1'
          *.iml
          .gradle/
          /build/
          /app/build/
          /local.properties
          /.idea/
          .DS_Store
          /captures/
          .externalNativeBuild
          .cxx/
          SQEOF_1
          cat > app/build.gradle.kts <<'SQEOF_2'
          import java.util.Properties
          
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          
          // 密钥只从环境变量 / Gradle 属性 / 本地 local.properties 读取，绝不写进仓库。
          // 云端构建时可用 Secret 注入；不注入也没关系，App 内可自行填写 Key。
          val localProperties = Properties().apply {
              val file = rootProject.file("local.properties")
              if (file.exists()) file.inputStream().use { load(it) }
          }
          val rawKey = listOfNotNull(
              System.getenv("DEEPSEEK_API_KEY"),
              providers.gradleProperty("DEEPSEEK_API_KEY").orNull,
              localProperties.getProperty("DEEPSEEK_API_KEY")
          ).firstOrNull { it.isNotBlank() }?.trim() ?: ""
          val deepSeekKey = rawKey.replace("\\", "\\\\").replace("\"", "\\\"")
          
          android {
              namespace = "com.example.screenqa"
              compileSdk = 35
          
              defaultConfig {
                  applicationId = "com.example.screenqa"
                  minSdk = 29              // Android 10+
                  targetSdk = 35
                  multiDexEnabled = true  // PDFBox 类较多；minSdk>=21 原生支持，无需 multidex 依赖库
                  versionCode = 11
                  versionName = "2.9"
                  buildConfigField("String", "DEEPSEEK_API_KEY", "\"$deepSeekKey\"")
              }
          
              buildFeatures {
                  buildConfig = true       // AGP 8+ 默认不生成 BuildConfig，必须显式打开
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity-ktx:1.9.3")
          
              // 中文 OCR：chinese 提供打包模型，text-recognition 提供 ChineseTextRecognizerOptions 等配置类
              implementation("com.google.mlkit:text-recognition-chinese:16.0.1")
              implementation("com.google.mlkit:text-recognition:16.0.1")
          
              // 不能用 5.4.0+：其 Android 变体 okhttp-android 的 minCompileSdk=36/37，超出本工程的
              // compileSdk=35，会在 :app:checkDebugAarMetadata 直接失败（实测 5.5.0 报 "requires ... version 37"）。
              // 5.3.2 的 minCompileSdk=1，兼容，且 API 与 5.5 一致（toMediaType/toRequestBody 均可用）。
              implementation("com.squareup.okhttp3:okhttp:5.3.2")
          
              // PDF 题库解析：纯 Java 库，minCompileSdk=1，无 Kotlin 元数据风险（已实测 AAR 元数据）。
              // 排除 BouncyCastle：Android 系统自带精简版 BC，打包完整 BC 会冲突；
              // 文字提取不需要它（仅加密/签名 PDF 需要），排除后加密 PDF 将解析失败，属可接受取舍。
              implementation("com.tom-roush:pdfbox-android:2.0.27.0") {
                  exclude(group = "org.bouncycastle")
              }
          
              // 注意：org.json 由 Android 平台自带，不需要额外依赖，加了反而容易 duplicate class
          }
          SQEOF_2
          cat > app/src/main/AndroidManifest.xml <<'SQEOF_3'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <!-- Android 14 (API 34) 起，mediaProjection 类型的前台服务必须声明此权限 -->
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <!-- Android 13 (API 33) 起需要运行时申请 -->
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          
              <application
                  android:name=".QaApp"
                  android:allowBackup="false"
                  android:icon="@android:drawable/ic_menu_search"
                  android:label="屏幕答题助手"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.ScreenQA"
                  android:usesCleartextTraffic="false">
          
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize|uiMode|density"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <service
                      android:name=".FloatService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          
          </manifest>
          SQEOF_3
          cat > app/src/main/assets/qa.csv <<'SQEOF_4'
          question,answer
          中国的首都是哪里,北京
          1+1等于几,2
          OSI参考模型中负责把数据封装成帧的是哪一层,数据链路层
          IPv4地址由多少位二进制组成,32位
          TCP三次握手中第一个报文置位的标志位是什么,SYN
          192.168.1.0/24网段的广播地址是什么,192.168.1.255
          交换机依据哪种地址转发数据帧,MAC地址
          默认网关的作用是什么,为本网段以外的流量提供下一跳出口
          "下列协议中属于传输层，且面向连接的是哪一个","TCP。UDP 面向无连接，IP 属于网络层"
          SQEOF_4
          cat > app/src/main/java/com/example/screenqa/AiClient.kt <<'SQEOF_5'
          package com.example.screenqa
          
          import android.content.Context
          import okhttp3.Call
          import okhttp3.Callback
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import okhttp3.Response
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.util.concurrent.TimeUnit
          
          /**
           * AI 兜底：统一走 OpenAI-compatible 的 chat/completions 协议。
           * 主流服务商（OpenAI / DeepSeek / 通义 / GLM / Kimi / 豆包 / MiniMax / 文心 / Gemini 等）
           * 都提供兼容接口，只改 base URL + 模型名 + Key 即可，因此这里做成"预设 + 自定义"。
           *
           * 配置全部保存在手机本机 SharedPreferences：每个服务商的 Key、URL、模型名独立保存，
           * 切换服务商不会互相覆盖。回调在 OkHttp 工作线程执行，调用方需自行切回主线程更新 UI。
           */
          object AiClient {
          
              /** 一个服务商预设：id 唯一；url 为完整的 chat/completions 地址；model 为默认模型 */
              data class Provider(
                  val id: String,
                  val name: String,
                  val url: String,
                  val model: String,
                  val note: String = ""
              )
          
              // 默认模型名只作参考，用户在 App 内可随时改（模型迭代很快，写死容易失效）
              val PRESETS: List<Provider> = listOf(
                  Provider("deepseek", "DeepSeek", "https://api.deepseek.com/chat/completions", "deepseek-v4-flash", "国内直连，性价比高"),
                  Provider("openai", "OpenAI", "https://api.openai.com/v1/chat/completions", "gpt-4o-mini", "需能访问 OpenAI"),
                  Provider("qwen", "通义千问", "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions", "qwen-plus", "阿里云百炼兼容模式"),
                  Provider("glm", "智谱 GLM", "https://open.bigmodel.cn/api/paas/v4/chat/completions", "glm-4-flash", "glm-4-flash 免费"),
                  Provider("kimi", "Kimi", "https://api.moonshot.cn/v1/chat/completions", "moonshot-v1-8k", "月之暗面"),
                  Provider("doubao", "豆包（火山方舟）", "https://ark.cn-beijing.volces.com/api/v3/chat/completions", "", "模型名需填方舟创建的端点 ID（ep-xxx）"),
                  Provider("minimax", "MiniMax", "https://api.minimax.chat/v1/chat/completions", "MiniMax-Text-01", ""),
                  Provider("ernie", "百度文心", "https://qianfan.baidubce.com/v2/chat/completions", "ernie-4.0-8k", "千帆 v2 兼容模式"),
                  Provider("gemini", "Google Gemini", "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions", "gemini-2.0-flash", "OpenAI 兼容端点"),
                  Provider("custom", "自定义（OpenAI 兼容）", "", "", "自行填写完整接口地址与模型名")
              )
          
              private const val PREF_NAME = "screenqa_prefs"
              private const val PREF_PROVIDER = "ai_provider_id"
              private const val PREF_KEY_PREFIX = "ai_key_"
              private const val PREF_URL_PREFIX = "ai_url_"
              private const val PREF_MODEL_PREFIX = "ai_model_"
              // 旧版 DeepSeek Key 的存储名，用于迁移，避免老用户升级后 Key 丢失
              private const val LEGACY_KEY = "deepseek_api_key"
          
              private val client = OkHttpClient.Builder()
                  .connectTimeout(15, TimeUnit.SECONDS)
                  .readTimeout(60, TimeUnit.SECONDS)
                  .writeTimeout(30, TimeUnit.SECONDS)
                  .build()
          
              private fun prefs(context: Context) =
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
          
              fun providers(): List<Provider> = PRESETS
          
              fun findProvider(id: String): Provider = PRESETS.firstOrNull { it.id == id } ?: PRESETS[0]
          
              fun currentId(context: Context): String =
                  prefs(context).getString(PREF_PROVIDER, null)?.takeIf { it.isNotBlank() } ?: "deepseek"
          
              fun setProvider(context: Context, id: String) {
                  prefs(context).edit().putString(PREF_PROVIDER, id).apply()
              }
          
              fun currentProvider(context: Context): Provider = findProvider(currentId(context))
          
              /** 当前服务商生效的 Key：自定义保存值优先，DeepSeek 兼容旧 Key 与构建注入值 */
              fun readKey(context: Context): String = readKeyFor(context, currentId(context))
          
              fun readKeyFor(context: Context, id: String): String {
                  val p = prefs(context)
                  val saved = p.getString(PREF_KEY_PREFIX + id, null)?.takeIf { it.isNotBlank() }
                  if (saved != null) return saved
                  if (id == "deepseek") {
                      val legacy = p.getString(LEGACY_KEY, null)?.takeIf { it.isNotBlank() }
                      if (legacy != null) return legacy
                      if (BuildConfig.DEEPSEEK_API_KEY.isNotBlank()) return BuildConfig.DEEPSEEK_API_KEY
                  }
                  return ""
              }
          
              /** 兼容旧调用：保存到当前服务商 */
              fun saveKey(context: Context, key: String) = saveKeyFor(context, currentId(context), key)
          
              fun saveKeyFor(context: Context, id: String, key: String) {
                  prefs(context).edit().putString(PREF_KEY_PREFIX + id, key.trim()).apply()
              }
          
              /** 生效的接口地址：自定义保存值优先，否则用预设 */
              fun readUrl(context: Context): String = readUrlFor(context, currentId(context))
          
              fun readUrlFor(context: Context, id: String): String {
                  val saved = prefs(context).getString(PREF_URL_PREFIX + id, null)
                  return if (!saved.isNullOrBlank()) saved.trim() else findProvider(id).url
              }
          
              fun saveUrlFor(context: Context, id: String, url: String) {
                  prefs(context).edit().putString(PREF_URL_PREFIX + id, url.trim()).apply()
              }
          
              /** 生效的模型名：自定义保存值优先，否则用预设 */
              fun readModel(context: Context): String = readModelFor(context, currentId(context))
          
              fun readModelFor(context: Context, id: String): String {
                  val saved = prefs(context).getString(PREF_MODEL_PREFIX + id, null)
                  return if (!saved.isNullOrBlank()) saved.trim() else findProvider(id).model
              }
          
              fun saveModelFor(context: Context, id: String, model: String) {
                  prefs(context).edit().putString(PREF_MODEL_PREFIX + id, model.trim()).apply()
              }
          
              fun isConfigured(context: Context): Boolean = readKey(context).isNotBlank()
          
              fun ask(context: Context, question: String, callback: (String) -> Unit) {
                  val id = currentId(context)
                  val provider = findProvider(id)
                  val key = readKeyFor(context, id)
                  val url = readUrlFor(context, id)
                  val model = readModelFor(context, id)
          
                  if (key.isBlank()) {
                      callback("未配置 API Key：请在 App 内为「${provider.name}」填写并保存 Key。题库命中不受影响。")
                      return
                  }
                  if (url.isBlank()) {
                      callback("未配置接口地址：请为「${provider.name}」填写完整的 chat/completions 地址。")
                      return
                  }
                  if (model.isBlank()) {
                      callback("未配置模型名：请为「${provider.name}」填写模型名（豆包需填端点 ID）。")
                      return
                  }
          
                  // 用 JSONObject 构造请求体，避免手工拼接 JSON 时的转义问题
                  val requestBody = JSONObject().apply {
                      put("model", model)
                      put("temperature", 0)
                      put("messages", JSONArray().apply {
                          put(JSONObject().apply {
                              put("role", "system")
                              put(
                                  "content",
                                  "你是答题助手，用于课后练习自测。严格分两部分回答：" +
                                      "第一行以「【答案】」开头给出最终答案（选择题给选项字母+内容，填空/简答给完整结果）；" +
                                      "换行后以「【解析】」开头给出简明但完整的解析（3-5 行，说明关键步骤或依据）。" +
                                      "不要使用 Markdown 加粗/标题/代码块符号，不要输出客套话。"
                              )
                          })
                          put(JSONObject().apply {
                              put("role", "user")
                              put("content", question.take(4000))
                          })
                      })
                  }.toString()
          
                  // 自定义服务商可能填了非法地址（缺 http:// 、含空格等），url() 会抛异常。
                  // 就地转成可读提示，避免冒泡到调用方显示为不准确的「本地解析异常」。
                  val request = try {
                      Request.Builder()
                          .url(url)
                          .header("Authorization", "Bearer $key")
                          .post(requestBody.toRequestBody("application/json; charset=utf-8".toMediaType()))
                          .build()
                  } catch (t: Throwable) {
                      callback("接口地址格式有误（${provider.name}）：${t.message ?: url}")
                      return
                  }
          
                  client.newCall(request).enqueue(object : Callback {
                      override fun onFailure(call: Call, e: IOException) {
                          runCatching {
                              callback("AI 请求失败（${provider.name}）：${e.message ?: "网络异常，请检查网络"}")
                          }
                      }
          
                      override fun onResponse(call: Call, response: Response) {
                          var delivered = false
                          try {
                              response.use { resp ->
                                  // 显式按 UTF-8 解码，避免依赖响应头 charset 缺失时的乱码。
                                  // 读取响应流可能因网络中断抛异常，兜底为空串继续走可读的错误提示。
                                  val body = runCatching {
                                      resp.body?.bytes()?.let { String(it, Charsets.UTF_8) }.orEmpty()
                                  }.getOrDefault("")
                                  val answer = if (!resp.isSuccessful) {
                                      val hint = httpErrorHint(resp.code, body)
                                      "AI 接口 HTTP ${resp.code}（${provider.name}）：$hint"
                                  } else {
                                      try {
                                          val msg = JSONObject(body)
                                              .getJSONArray("choices")
                                              .getJSONObject(0)
                                              .getJSONObject("message")
                                          // 部分推理模型把正文放在 content，思考过程在 reasoning_content；
                                          // 这里只取 content（答案），避免解析过程混入。
                                          val content = msg.optString("content", "")
                                          TextCleaner.cleanAnswer(content)
                                              .ifEmpty { "AI 返回空内容（请检查模型名是否正确）" }
                                      } catch (t: Throwable) {
                                          "解析失败（${provider.name}）：${TextCleaner.clean(body).take(200)}"
                                      }
                                  }
                                  delivered = true
                                  callback(answer)
                              }
                          } catch (t: Throwable) {
                              // 流读取 / close 等遗漏异常在这里兜住，保证 callback 恰好返回一次；
                              // 否则上层 answerOne 的多题计数不会归零，按钮要等 90 秒兜底才恢复。
                              if (!delivered) {
                                  runCatching {
                                      callback("AI 响应异常（${provider.name}）：${t.javaClass.simpleName}：${t.message ?: "未知原因"}")
                                  }
                              }
                          }
                      }
                  })
              }
          
              /** 把常见 HTTP 错误码翻译成人能看懂的提示，并尽量带出服务商返回的原因 */
              private fun httpErrorHint(code: Int, body: String): String {
                  val base = when (code) {
                      400 -> "请求参数有误（模型名或地址可能不对）"
                      401 -> "API Key 无效或已过期"
                      403 -> "无权限访问该模型 / Key 权限不足"
                      404 -> "接口地址或模型名不存在"
                      429 -> "请求过于频繁或额度不足"
                      in 500..599 -> "服务商服务端暂时异常，请稍后重试"
                      else -> "请求失败"
                  }
                  // 尝试从错误 JSON 里取 message 字段，让排查更具体
                  val detail = runCatching {
                      JSONObject(body).optJSONObject("error")?.optString("message")
                          ?.takeIf { it.isNotBlank() }?.take(160)
                  }.getOrNull()
                  return if (detail.isNullOrBlank()) base else "$base：$detail"
              }
          }
          SQEOF_5
          cat > app/src/main/java/com/example/screenqa/BankImporter.kt <<'SQEOF_6'
          package com.example.screenqa
          
          import android.content.Context
          import android.net.Uri
          import android.util.Xml
          import com.tom_roush.pdfbox.android.PDFBoxResourceLoader
          import com.tom_roush.pdfbox.pdmodel.PDDocument
          import com.tom_roush.pdfbox.text.PDFTextStripper
          import org.xmlpull.v1.XmlPullParser
          import java.util.zip.ZipInputStream
          
          /**
           * 题库文件解析器。支持格式：
           *  - txt / csv / tsv：每行一题，"题目,答案"（英文逗号 / 制表符 / 中文逗号分隔，支持引号包裹）
           *  - xlsx：第一个工作表，A 列题目、B 列答案
           *  - docx：每段一行，再按上面的分隔规则解析
           *  - pptx：按页提取文字段落，每段一行，再按分隔规则解析
           *  - pdf ：提取文字后每行按分隔规则解析（要求"题目,答案"在同一行；加密 PDF 不支持）
           *
           * 解析原则：docx/pptx/xlsx 本质是 zip+XML，用系统自带 XmlPullParser 解，不引入 Apache POI
           * （POI 在 Android 上体积大且有兼容性问题）。PDF 无内建方案，用 pdfbox-android。
           */
          object BankImporter {
          
              /** pairs=解析出的题目；skipped=无法解析的行数；error=整体失败原因（非空时 pairs 无效） */
              data class Result(
                  val pairs: List<Pair<String, String>>,
                  val skipped: Int,
                  val error: String? = null
              )
          
              fun import(context: Context, uri: Uri, extHint: String): Result {
                  val bytes = try {
                      context.contentResolver.openInputStream(uri)?.use { it.readBytes() }
                  } catch (t: Throwable) {
                      return Result(
                          emptyList(), 0,
                          "读取文件失败：${friendlyError(t)}。若从微信/QQ直接打开，请先「保存到文件」再导入。"
                      )
                  } ?: return Result(emptyList(), 0, "无法读取文件内容（来源：${uri.scheme ?: "未知"}）")
                  if (bytes.isEmpty()) return Result(emptyList(), 0, "文件为空")
                  // 防 OOM：整个文件会读进内存，超大文件直接拒绝
                  if (bytes.size > MAX_FILE_BYTES) {
                      return Result(emptyList(), 0, "文件过大（${bytes.size / 1048576}MB），请拆分后导入（上限 ${MAX_FILE_BYTES / 1048576}MB）")
                  }
          
                  // 关键：文件名扩展名只当"提示"，最终以 MIME + 文件头嗅探为准。
                  // 从微信/QQ/第三方文件管理器选文件时经常拿不到文件名或扩展名是错的，
                  // 以前直接凭扩展名判断，拿不到就报"不支持的格式"——这正是"无法导入"的根因。
                  val ext = resolveExt(context, uri, bytes, extHint)
                  if (ext == "?") {
                      return Result(
                          emptyList(), 0,
                          "无法识别文件格式（扩展名：${extHint.ifEmpty { "无" }}，已读取 ${bytes.size} 字节）。" +
                              "请确认文件未损坏，支持 txt/csv/docx/pptx/xlsx/pdf。"
                      )
                  }
          
                  return try {
                      when (ext) {
                          "txt", "csv", "tsv" -> parseLines(decodeText(bytes).lines())
                          "xlsx" -> importXlsx(bytes)
                          // 文档类必须走段落解析：自动识别【编程题】/【程序运行示例】/【答案】等
                          // 结构化标记并把跨段落的题目与答案配对；没有这些标记时会自动回落到
                          // 旧的「题目,答案」逐行解析，保证两种题库格式都能用。
                          "docx" -> parseParagraphs(extractDocxLines(bytes))
                          "pptx" -> parseParagraphs(extractPptxLines(bytes))
                          "pdf" -> parseParagraphs(extractPdfLines(context, bytes))
                          else -> Result(emptyList(), 0, "不支持的格式：.$ext")
                      }
                  } catch (t: Throwable) {
                      // 捕获 Throwable 而非 Exception：OOM 等 Error 也要兜住，避免导入时闪退
                      Result(emptyList(), 0, friendlyError(t))
                  }
              }
          
              private val SUPPORTED_EXTS = setOf("txt", "csv", "tsv", "xlsx", "docx", "pptx", "pdf")
          
              /** 扩展名提示 → MIME → 文件头嗅探，返回真实格式；无法判断返回 "?" */
              private fun resolveExt(context: Context, uri: Uri, bytes: ByteArray, hint: String): String {
                  val h = hint.lowercase().trim().removePrefix(".")
                  if (h in SUPPORTED_EXTS) return h
          
                  val mime = runCatching { context.contentResolver.getType(uri)?.lowercase() }.getOrNull()
                  if (!mime.isNullOrBlank()) {
                      val guessed = when {
                          mime.contains("wordprocessingml") || mime.contains("msword") -> "docx"
                          mime.contains("presentationml") || mime.contains("ms-powerpoint") -> "pptx"
                          mime.contains("spreadsheetml") || mime.contains("ms-excel") -> "xlsx"
                          mime.contains("pdf") -> "pdf"
                          mime.contains("csv") -> "csv"
                          mime.contains("tab-separated") -> "tsv"
                          mime.contains("text/plain") -> "txt"
                          else -> ""
                      }
                      if (guessed.isNotEmpty()) return guessed
                  }
                  return sniffExt(bytes)
              }
          
              /** 按文件头判断真实格式：ZIP 家族看内部条目名，%PDF 看魔数，其余按纯文本 */
              private fun sniffExt(bytes: ByteArray): String {
                  // ZIP 魔数 PK\x03\x04：docx / pptx / xlsx 都是 zip
                  if (bytes.size >= 4 && bytes[0] == 0x50.toByte() && bytes[1] == 0x4B.toByte() &&
                      bytes[2] == 0x03.toByte() && bytes[3] == 0x04.toByte()
                  ) {
                      val names = runCatching { unzip(bytes).keys }.getOrDefault(emptySet())
                      return when {
                          names.any { it.startsWith("word/") } -> "docx"
                          names.any { it.startsWith("ppt/") } -> "pptx"
                          names.any { it.startsWith("xl/") } -> "xlsx"
                          else -> "?"
                      }
                  }
                  // PDF 魔数 %PDF
                  if (bytes.size >= 4 && bytes[0] == 0x25.toByte() && bytes[1] == 0x50.toByte() &&
                      bytes[2] == 0x44.toByte() && bytes[3] == 0x46.toByte()
                  ) return "pdf"
                  // 无二进制魔数：当成文本，让 parseLines 尝试按"题目,答案"解析
                  return "txt"
              }
          
              private fun friendlyError(t: Throwable): String = when (t) {
                  is OutOfMemoryError -> "内存不足（文件太大或内容太多），请拆分文件后再导入"
                  else -> "解析失败：${t.javaClass.simpleName}：${t.message ?: "未知原因"}"
              }
          
              // ---------------- 文本行解析 ----------------
          
              /** 把若干行文本解析成 题目/答案 对 */
              fun parseLines(lines: List<String>): Result {
                  val pairs = mutableListOf<Pair<String, String>>()
                  var skipped = 0
                  lines.forEachIndexed { index, raw ->
                      val line = TextCleaner.clean(raw).trim()
                      if (line.isEmpty()) return@forEachIndexed
                      val qa = splitQA(line)
                      if (qa == null) {
                          skipped++
                          return@forEachIndexed
                      }
                      val q = qa.first.trim()
                      val a = qa.second.trim()
                      // 跳过常见表头
                      if (index == 0 && (q.equals("question", true) || q == "题目" || q == "问题")) {
                          return@forEachIndexed
                      }
                      if (q.isEmpty() || a.isEmpty()) {
                          skipped++
                          return@forEachIndexed
                      }
                      pairs += q to a
                  }
                  return Result(pairs, skipped)
              }
          
              /** 一行文本 → 题目/答案。依次尝试：制表符 → 英文逗号(CSV规则) → 中文逗号 */
              fun splitQA(line: String): Pair<String, String>? {
                  val tab = line.indexOf('\t')
                  if (tab > 0) return line.substring(0, tab) to line.substring(tab + 1)
          
                  val cells = splitCsv(line)
                  if (cells.size >= 2 && cells[0].isNotBlank()) {
                      return cells[0] to cells.drop(1).joinToString(",")
                  }
          
                  val cn = line.indexOf('，')
                  if (cn > 0) return line.substring(0, cn) to line.substring(cn + 1)
          
                  return null
              }
          
              /** CSV 切分：支持双引号包裹、字段内逗号、"" 表示字面引号 */
              private fun splitCsv(line: String): List<String> {
                  val out = mutableListOf<String>()
                  val sb = StringBuilder()
                  var inQuotes = false
                  var i = 0
                  while (i < line.length) {
                      val ch = line[i]
                      when {
                          inQuotes -> when {
                              ch == '"' && i + 1 < line.length && line[i + 1] == '"' -> {
                                  sb.append('"'); i++
                              }
                              ch == '"' -> inQuotes = false
                              else -> sb.append(ch)
                          }
                          ch == '"' && sb.isEmpty() -> inQuotes = true
                          ch == ',' -> {
                              out += sb.toString(); sb.setLength(0)
                          }
                          else -> sb.append(ch)
                      }
                      i++
                  }
                  out += sb.toString()
                  return out
              }
          
              /** UTF-8 解码；去 BOM，出现替换字符则用 GBK 重解 */
              private fun decodeText(bytes: ByteArray): String {
                  var b = bytes
                  // 去掉 UTF-8 BOM，否则首行表头会多出不可见字符导致匹配失败
                  if (b.size >= 3 && b[0] == 0xEF.toByte() && b[1] == 0xBB.toByte() && b[2] == 0xBF.toByte()) {
                      b = b.copyOfRange(3, b.size)
                  }
                  val utf8 = String(b, Charsets.UTF_8)
                  if (utf8.contains('\uFFFD')) {
                      return runCatching { String(b, charset("GBK")) }.getOrDefault(utf8).removePrefix("\uFEFF")
                  }
                  return utf8
              }
          
              // ---------------- 结构化题库解析（【编程题】/【答案】等标记） ----------------
          
              // 答案/解析段标记：【答案】【解析】【程序运行示例】【参考答案】或"答案：""解析："开头
              private val ANSWER_MARK =
                  Regex("【[^】]*(答案|解析|运行示例)[^】]*】|^(答案|解析|参考答案)\\s*[:：]")
              // 题型标记（用于判定"题目起点"）：涵盖 题/示例/优化/改错/填空/选择/判断/简答，
              // 并排除独立的答案标记行（如单独的【程序运行示例】不是题目起点）。
              private val QUESTION_TYPE_MARK =
                  Regex("【[^】]*(题|示例|优化|改错|填空|选择|判断|简答)[^】]*】")
              // 题目之间的分隔线（如一串 ====）：遇到即结束当前答案区，避免吞入后续内容。
              private val SECTION_SEPARATOR = Regex("^=+\\s*$")
          
              // ---------------- 编号选择题库解析（1、/ 1. / 1．题号 + A/B/C/D + 答案/解析） ----------------
              // 真实题库（如军事理论/公考/教材题库）普遍采用这种格式，而非【编程题】方括号标记。
              // 旧版只认【】标记，遇到编号题库会识别出 0 题——这是"导入后题目数量不对/无法导入"的根因。
              private val NUMBERED_QUESTION_START = Regex("^\\d{1,4}\\s*[、.．]")   // 题号起点
              // 答案标记：兼容"答案：""正确答案：""参考答案："，冒号后内容即答案首行
              private val NUMBERED_ANSWER_MARK = Regex("^\\s*(正确答案|参考答案|答案)\\s*[:：]\\s*(.*)$")
              // 解析标记：兼容"解析：""答案解析：""【解析】"（行首）
              private val NUMBERED_EXP_MARK = Regex("^\\s*(解析|答案解析|【解析】)\\s*[:：]?\\s*(.*)$")
              // 行内解析标记：答案与解析写在同一行，如"答案： ABCD 解析：原文指出…"或"答案：B【解析】…"。
              // 真实题库 409 个答案行中有 398 个是这种同行格式，旧版只认行首解析，导致解析被吞进答案。
              private val NUMBERED_EXP_INLINE = Regex("(?:^|\\s|】)(解析|答案解析|【解析】)\\s*[:：]?\\s*")
              // 选项行：A、B、C、D 开头；判断是否还有纯答案（用于选项后直接标答案的题库）
              private val NUMBERED_OPTION_LINE = Regex("^[A-Za-z]\\s*[、.．]")
          
              /**
               * 统一入口：按题库格式自动路由到对应解析器。
               *  1) 编号选择题库（题号+选项+答案）→ parseNumbered
               *  2) 【编程题】类结构化标记 → parseStructured
               *  3) "题目,答案"简单格式 → parseLines
               */
              fun parseParagraphs(lines: List<String>): Result {
                  val cleaned = lines.map { TextCleaner.clean(it).trim() }
                  val numberedCount = countNumberedQuestions(cleaned)
                  // 至少 2 道编号题才判定为编号题库：避免把正文里偶发的"1、"误判成题库。
                  if (numberedCount >= 2) return parseNumbered(cleaned)
                  val structured = cleaned.any {
                      QUESTION_TYPE_MARK.containsMatchIn(it) || ANSWER_MARK.containsMatchIn(it)
                  }
                  return if (structured) parseStructured(cleaned) else parseLines(cleaned)
              }
          
              private fun countNumberedQuestions(cleaned: List<String>): Int =
                  flattenLogicalLines(cleaned).count { NUMBERED_QUESTION_START.containsMatchIn(it) }
          
              /** 段落按软换行(\n)展开成逻辑行并去空白——答案/解析常在同一段落内用换行分隔 */
              private fun flattenLogicalLines(lines: List<String>): List<String> =
                  lines.flatMap { it.split('\n') }.map { it.trim() }.filter { it.isNotEmpty() }
          
              /**
               * 编号选择题库解析：题号行切题，题干内分出答案区与解析区。
               * 答案统一加【答案】【解析】标记，供显示层着色分区（与 AI 答案格式一致）。
               */
              private fun parseNumbered(lines: List<String>): Result {
                  val logical = flattenLogicalLines(lines)
                  val starts = logical.indices.filter { NUMBERED_QUESTION_START.containsMatchIn(logical[it]) }
                  if (starts.isEmpty()) return Result(emptyList(), 0)
          
                  val pairs = mutableListOf<Pair<String, String>>()
                  for (k in starts.indices) {
                      val from = starts[k]
                      val to = if (k + 1 < starts.size) starts[k + 1] else logical.size
                      val q = StringBuilder()
                      val ans = StringBuilder()
                      val exp = StringBuilder()
                      var zone = 'q' // q=题干, a=答案, e=解析
                      for (i in from until to) {
                          val line = logical[i]
                          val ma = NUMBERED_ANSWER_MARK.matchEntire(line)
                          val me = NUMBERED_EXP_MARK.matchEntire(line)
                          when {
                              ma != null -> {
                                  zone = 'a'
                                  var tail = ma.groupValues[2].trim()
                                  // 关键：答案与解析常写在同一行（"答案：ABCD 解析：原文…"），
                                  // 必须在 tail 内就地切出解析，否则 398/409 题的解析被吞进答案。
                                  NUMBERED_EXP_INLINE.find(tail)?.let { im ->
                                      val cut = im.range.first
                                      val after = tail.substring(cut + im.value.length).trim()
                                      tail = tail.substring(0, cut).trim()
                                      if (tail.isNotEmpty()) ans.append(tail).append('\n')
                                      if (after.isNotEmpty()) { exp.append(after).append('\n'); zone = 'e' }
                                  } ?: run {
                                      if (tail.isNotEmpty()) ans.append(tail).append('\n')
                                  }
                              }
                              me != null -> {
                                  zone = 'e'
                                  val tail = me.groupValues[2].trim()
                                  if (tail.isNotEmpty()) exp.append(tail).append('\n')
                              }
                              zone == 'q' -> q.append(line).append('\n')
                              zone == 'a' -> {
                                  // 答案区后续行里若突然出现行内解析（跨行情况），同样就地切分
                                  NUMBERED_EXP_INLINE.find(line)?.let { im ->
                                      val cut = im.range.first
                                      val before = line.substring(0, cut).trim()
                                      val after = line.substring(cut + im.value.length).trim()
                                      if (before.isNotEmpty()) ans.append(before).append('\n')
                                      if (after.isNotEmpty()) exp.append(after).append('\n')
                                      zone = 'e'
                                  } ?: ans.append(line).append('\n')
                              }
                              else -> exp.append(line).append('\n')
                          }
                      }
                      val question = q.toString().trim()
                      if (question.length < 4) continue
                      val answerText = ans.toString().trim()
                      val expText = exp.toString().trim()
                      val answer = buildString {
                          append("【答案】\n")
                          append(if (answerText.isNotEmpty()) answerText else "（本题无参考答案，可用 AI 解答）")
                          if (expText.isNotEmpty()) append("\n【解析】\n").append(expText)
                      }
                      pairs += question to answer
                  }
                  return Result(pairs, 0)
              }
          
              /**
               * 结构化题库分段解析（诊断修复版）。
               *
               * 真实的实训报告类文档有两个区域：
               *  1) "实验内容"题目清单：连续多个【编程题】，只有题干没有答案；
               *  2) "报告内容"正文：同样这些题，每题后跟【程序运行示例】等答案。
               * 旧状态机从文档开头连续扫描，把清单区的题也卷入，导致题目数量、配对错位，
               * 且无答案的题（如【AI优化】）被丢弃、上一题答案吞入下一题题干。
               *
               * 新算法：
               *  - 先按"题目起点"把所有段落切成若干段（每段 = 题目标记行 + 后续内容）；
               *  - 每段内部分出题干与答案（答案从 ANSWER_MARK 开始，遇分隔线结束）；
               *  - 以"第一个含答案标记的段"作为正文区起点，跳过其前的纯清单区；
               *  - 正文区每段都保留；无答案的题用占位文案（可交给 AI 解答）。
               */
              private fun parseStructured(lines: List<String>): Result {
                  fun isQuestionStart(line: String): Boolean =
                      QUESTION_TYPE_MARK.containsMatchIn(line) &&
                          line.length > 8 && !ANSWER_MARK.containsMatchIn(line)
          
                  val starts = lines.indices.filter { isQuestionStart(lines[it]) }
                  if (starts.isEmpty()) return Result(emptyList(), 0)
          
                  data class Seg(val question: String, val answer: String, val hasAnswerMark: Boolean)
                  val segs = mutableListOf<Seg>()
                  for (k in starts.indices) {
                      val from = starts[k]
                      val to = if (k + 1 < starts.size) starts[k + 1] else lines.size
                      val body = lines.subList(from, to)
                      val q = StringBuilder().append(body[0])
                      val a = StringBuilder()
                      var inAnswer = false
                      var marked = false
                      for (i in 1 until body.size) {
                          val line = body[i]
                          if (line.isEmpty()) continue
                          if (SECTION_SEPARATOR.containsMatchIn(line)) {
                              inAnswer = false
                              continue
                          }
                          if (ANSWER_MARK.containsMatchIn(line)) {
                              marked = true
                              inAnswer = true
                              val after = line.replace(ANSWER_MARK, "").trim()
                              if (after.isNotEmpty()) a.append(after).append('\n')
                              continue
                          }
                          if (inAnswer) a.append(line).append('\n') else q.append(line).append('\n')
                      }
                      segs += Seg(q.toString().trim(), a.toString().trim(), marked)
                  }
          
                  // 第一个带答案标记的段 = 正文区起点；其前是"题目清单"，跳过避免重复与错位。
                  // 若整份文档都没有答案标记（纯题目清单），则从第 0 段开始全部保留。
                  val firstMarkedIdx = segs.indexOfFirst { it.hasAnswerMark }
                  val firstMarked = if (firstMarkedIdx < 0) 0 else firstMarkedIdx
                  val pairs = mutableListOf<Pair<String, String>>()
                  for (i in firstMarked until segs.size) {
                      val s = segs[i]
                      if (s.question.length < 4) continue
                      val answer = if (s.answer.isNotEmpty()) s.answer else "（本题无参考答案，可用 AI 解答）"
                      pairs += s.question to answer
                  }
                  return Result(pairs, 0)
              }
          
              // ---------------- zip/XML 系（docx / pptx / xlsx） ----------------
          
              private fun unzip(bytes: ByteArray): Map<String, ByteArray> {
                  val map = LinkedHashMap<String, ByteArray>()
                  ZipInputStream(bytes.inputStream()).use { zis ->
                      var entry = zis.nextEntry
                      while (entry != null) {
                          if (!entry.isDirectory) map[entry.name] = zis.readBytes()
                          zis.closeEntry()
                          entry = zis.nextEntry
                      }
                  }
                  return map
              }
          
              /** 去掉命名空间前缀："w:t" → "t"，"a:p" → "p" */
              private fun local(name: String): String = name.substringAfter(':')
          
              /**
               * 抽取段落文本：把 <*:p> 视为段落边界、<*:t> 为文字、<*:tab>/<*:br> 为分隔。
               * docx 的 w:p/w:t 和 pptx 的 a:p/a:t 都满足这个模式，可共用。
               */
              private fun extractParagraphLines(xml: ByteArray): List<String> {
                  val lines = mutableListOf<String>()
                  val parser = Xml.newPullParser()
                  parser.setInput(xml.inputStream(), "UTF-8")
                  val sb = StringBuilder()
                  var inPara = false
                  var event = parser.eventType
                  while (event != XmlPullParser.END_DOCUMENT) {
                      when (event) {
                          XmlPullParser.START_TAG -> when (local(parser.name)) {
                              "p" -> {
                                  inPara = true; sb.setLength(0)
                              }
                              "t" -> if (inPara) {
                                  // nextText 在某些畸形 XML 上会抛异常，用 text+事件推进更稳
                                  val t = runCatching { parser.nextText() }.getOrDefault("")
                                  sb.append(t)
                              }
                              "tab" -> if (inPara) sb.append('\t')
                              "br" -> if (inPara) sb.append('\n')
                          }
                          XmlPullParser.END_TAG ->
                              if (local(parser.name) == "p" && inPara) {
                                  lines += sb.toString(); inPara = false
                              }
                      }
                      event = runCatching { parser.next() }.getOrDefault(XmlPullParser.END_DOCUMENT)
                  }
                  return lines
              }
          
              private fun extractDocxLines(bytes: ByteArray): List<String> {
                  val entries = unzip(bytes)
                  val doc = entries["word/document.xml"]
                      ?: throw IllegalArgumentException("不是有效的 docx（缺少 word/document.xml）")
                  return extractParagraphLines(doc)
              }
          
              private fun extractPptxLines(bytes: ByteArray): List<String> {
                  val entries = unzip(bytes)
                  val slideNames = entries.keys
                      .filter { Regex("ppt/slides/slide\\d+\\.xml").matches(it) }
                      .sortedBy { Regex("\\d+").find(it)!!.value.toInt() }
                  if (slideNames.isEmpty()) throw IllegalArgumentException("pptx 中找不到幻灯片")
                  return slideNames.flatMap { extractParagraphLines(entries.getValue(it)) }
              }
          
              /** xlsx：A 列题目、B 列答案（第一个工作表） */
              private fun importXlsx(bytes: ByteArray): Result {
                  val entries = unzip(bytes)
                  val shared = parseSharedStrings(entries["xl/sharedStrings.xml"])
                  val sheetName = entries.keys
                      .filter { Regex("xl/worksheets/sheet\\d+\\.xml").matches(it) }
                      .sortedBy { Regex("\\d+").find(it)!!.value.toInt() }
                      .firstOrNull()
                      ?: return Result(emptyList(), 0, "xlsx 中找不到工作表")
                  val rows = parseSheet(entries.getValue(sheetName), shared)
          
                  val pairs = mutableListOf<Pair<String, String>>()
                  var skipped = 0
                  rows.forEachIndexed { index, row ->
                      val q = row["A"]?.trim().orEmpty()
                      val a = row["B"]?.trim().orEmpty()
                      if (q.isEmpty() && a.isEmpty()) return@forEachIndexed
                      if (index == 0 && (q.equals("question", true) || q == "题目" || q == "问题")) {
                          return@forEachIndexed
                      }
                      if (q.isEmpty() || a.isEmpty()) {
                          skipped++
                          return@forEachIndexed
                      }
                      pairs += q to a
                  }
                  return Result(pairs, skipped)
              }
          
              /** 解析 xl/sharedStrings.xml：每个 <si> 的所有 <t> 拼接成一个字符串 */
              private fun parseSharedStrings(xml: ByteArray?): List<String> {
                  if (xml == null) return emptyList()
                  val list = mutableListOf<String>()
                  val parser = Xml.newPullParser()
                  parser.setInput(xml.inputStream(), "UTF-8")
                  val sb = StringBuilder()
                  var inSi = false
                  var event = parser.eventType
                  while (event != XmlPullParser.END_DOCUMENT) {
                      when (event) {
                          XmlPullParser.START_TAG -> when (local(parser.name)) {
                              "si" -> {
                                  inSi = true; sb.setLength(0)
                              }
                              "t" -> if (inSi) sb.append(parser.nextText())
                          }
                          XmlPullParser.END_TAG -> if (local(parser.name) == "si") {
                              list += sb.toString(); inSi = false
                          }
                      }
                      event = parser.next()
                  }
                  return list
              }
          
              /** 解析工作表：返回 行列表，每行是 列字母→文本 的映射 */
              private fun parseSheet(xml: ByteArray, shared: List<String>): List<Map<String, String>> {
                  val rows = mutableListOf<Map<String, String>>()
                  var currentRow: MutableMap<String, String>? = null
                  var cellCol: String? = null
                  var cellType: String? = null
                  var inValue = false
                  val sb = StringBuilder()
                  val parser = Xml.newPullParser()
                  parser.setInput(xml.inputStream(), "UTF-8")
                  var event = parser.eventType
                  while (event != XmlPullParser.END_DOCUMENT) {
                      when (event) {
